["20","Aprovação final do desenvolvimento","Consolidar atendimento às entradas, critérios de aceitação, processos subsequentes, conclusão e aprovação da Diretoria.",["Requisitos de entrada atendidos","Critérios de monitoramento e aceitação definidos","Documentação conferida","Conclusão registrada","Aprovação formal anexada"]],
["21","Liberação para produção","Registrar condições atendidas, especificações vigentes, cadastros e autorização para produção em série.",["Aprovações aplicáveis concluídas","Especificações vigentes disponíveis","Cadastro no Boot realizado no momento previsto","Liberação registrada"]],
["22","Lançamento do produto","Registrar data prevista e efetiva, responsáveis, materiais comerciais e comunicação aos setores.",["Data de lançamento registrada","Responsável identificado","Comunicação e materiais anexados"]],
["23","Acompanhamento pós-lançamento","Registrar desempenho, ocorrências, reclamações, resultados iniciais, melhorias e conclusão.",["Acompanhamento iniciado","Ocorrências registradas","Resultados avaliados","Conclusão documentada"]]
];
const ORIGINS=["Solicitação de cliente","Solicitação da Diretoria","Solicitação do setor Comercial","Ampliação da linha de produtos","Pesquisa de mercado","Oportunidade comercial","Necessidade técnica identificada pelo Desenvolvimento","Melhoria ou substituição de produto existente","Necessidade de terceirização","Outra origem"];
const TYPES=[["A","Novo produto"],["B","Produto existente no mercado"],["C","Alteração de embalagem"],["D1","Alteração de matéria-prima"],["D2","Alteração de característica do produto acabado"],["E","Terceirização"]];
const TYPE_DESC={"A":"produto <b>inédito</b> no mercado, ainda não existente na linha Hi Tech nem na concorrência.","B":"produto já existente em concorrentes, mas <b>novo na linha Hi Tech</b>.","C":"mudança de volume, material, design, ou fornecedor da embalagem, <b>sem alteração da formulação</b>.","D1":"substituição de componentes, aditivos ou veículos, mantendo as propriedades finais do produto.","D2":"mudança do tipo de caixa de papelão, cor do líquido.","E":"fabricação total ou parcial por fornecedor externo, sob especificação técnica e controle da Hi Tech."};
const TYPE_FULL={"A":"Novo produto","B":"Produto existente no mercado","C":"Alteração de embalagem","D1":"Alteração de matéria-prima produto já existente","D2":"Alterações de características de produtos acabados oriundas do mercado","E":"Terceirização"};
function typeDescHTML(t){return TYPE_FULL[t]?`<b>Tipo ${t} — ${TYPE_FULL[t]}:</b> ${TYPE_DESC[t]}`:""}
async function changeProjectType(v){const p=getP();if(!p||p.type===v)return;const old=p.type,m=document.querySelector(".main"),y=m?m.scrollTop:0;let ok=false;try{p.type=v;addEvent(p,"Tipo de desenvolvimento alterado",`Tipo ${old||"—"} → Tipo ${v}`);ok=await save(p)}catch(e){console.error(e);alert("Não foi possível salvar o tipo de desenvolvimento: "+(e.message||e))}if(ok){renderProject();if(m)m.scrollTop=y;setSync("Tipo atualizado")}else{p.type=old;if(p.events)p.events.pop();renderProjectTab()}}
let projects=[], currentId=null, currentTab="overview", supabaseClient=null, currentUser=null, realtimeChannel=null;
const STORAGE_BUCKET="hitech-evidencias";
function setSync(message,isError=false){const el=document.getElementById("syncState");if(el){el.textContent=message;el.style.color=isError?"#c74646":""}}
function showAuth(message=""){document.getElementById("authScreen").classList.add("show");document.getElementById("authError").textContent=message;document.getElementById("authError").classList.toggle("show",!!message);document.getElementById("logoutBtn").style.display="none"}
function hideAuth(){document.getElementById("authScreen").classList.remove("show");document.getElementById("logoutBtn").style.display="inline-block"}
async function signIn(){const email=document.getElementById("authEmail").value.trim(),password=document.getElementById("authPassword").value;const btn=document.getElementById("authLogin");if(!email||!password){showAuth("Informe o e-mail e a senha.");return}btn.disabled=true;btn.textContent="Entrando...";const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});btn.disabled=false;btn.textContent="Entrar no sistema";if(error){showAuth("Não foi possível entrar: "+error.message);return}currentUser=data.user;await startWorkspace()}
async function logout(){if(realtimeChannel)await supabaseClient.removeChannel(realtimeChannel);await supabaseClient.auth.signOut();currentUser=null;projects=[];showAuth("Você saiu do sistema.")}
async function initSupabase(){if(!window.supabase){showAuth("Não foi possível carregar a biblioteca de conexão (Supabase). Verifique sua internet e recarregue a página.");document.getElementById("authLogin").disabled=true;return}if(String(window.HITECH_SUPABASE_CONFIG?.url||"").includes("COLE_AQUI")||!window.HITECH_SUPABASE_CONFIG?.url||!window.HITECH_SUPABASE_CONFIG?.anonKey){showAuth("O arquivo config.js não foi encontrado junto com o site. No celular, abra pelo link do site publicado (https://...) e não pelo arquivo index.html enviado/baixado.");document.getElementById("authLogin").disabled=true;return}supabaseClient=window.supabase.createClient(window.HITECH_SUPABASE_CONFIG.url,window.HITECH_SUPABASE_CONFIG.anonKey);document.getElementById("authLogin").addEventListener("click",signIn);document.getElementById("authPassword").addEventListener("keydown",e=>{if(e.key==="Enter")signIn()});const {data:{session}}=await supabaseClient.auth.getSession();if(session){currentUser=session.user;await startWorkspace()}else showAuth() ;supabaseClient.auth.onAuthStateChange(async(event,session)=>{if(event==="SIGNED_OUT"){currentUser=null;projects=[];showAuth()}})}
async function startWorkspace(){hideAuth();document.getElementById("userEmail").textContent=currentUser.email||"Usuário";setSync("Sincronizando...");try{projects=await allProjects();renderDashboard();if(realtimeChannel)await supabaseClient.removeChannel(realtimeChannel);realtimeChannel=supabaseClient.channel("hitech-projects-sync").on("postgres_changes",{event:"*",schema:"public",table:"projects"},async()=>{try{projects=await allProjects();const page=document.querySelector(".nav button.active")?.dataset.page;if(currentId&&!projects.some(p=>p.id===currentId)){currentId=null;showPage("projects");return}if(currentId&&projects.some(p=>p.id===currentId)){if(window.__inProject)return;if(page===undefined)renderProject();else if(page==="dashboard")renderDashboard();else if(page==="projects")renderProjects();else if(page==="timeline")renderGlobalTimeline();else if(page==="backup")renderBackup();else renderProject()}}catch(e){console.error(e)}}).subscribe();setSync("Sincronizado")}catch(e){setSync("Falha na sincronização",true);alert("Não foi possível carregar os projetos do Supabase: "+e.message)}}
async function load(){await initSupabase()}
async function allProjects(){
 const {data,error}=await supabaseClient.from("projects").select("id,data,updated_at").order("updated_at",{ascending:false});
 if(error)throw error;
 return (data||[]).map(row=>({...row.data,projectRef:row.data?.projectRef||(String(row.data?.id||"").startsWith("PRJ-")?row.data.id:undefined),id:row.id,updated:row.data?.updated||row.updated_at,_serverUpdatedAt:row.updated_at}));
}
async function save(p){const expected=p._serverUpdatedAt;p.updated=new Date().toISOString();const payload={...p};delete payload._serverUpdatedAt;const productName=String(p.name||p.product||"").trim();if(!productName)throw new Error("Informe o nome do projeto/produto antes de salvar.");setSync("Salvando...");let result;if(expected){result=await supabaseClient.from("projects").update({product:productName,data:payload,updated_at:p.updated}).eq("id",p.id).eq("updated_at",expected).select("id")}else{result=await supabaseClient.from("projects").insert({id:p.id,product:productName,data:payload,updated_at:p.updated}).select("id")}if(result.error){setSync("Erro ao salvar",true);console.error("Erro detalhado ao salvar projeto:",result.error);throw result.error}if(!result.data?.length){projects=await allProjects();setSync("Conflito de edição",true);alert("Este projeto foi alterado por outra pessoa enquanto você estava editando. Recarreguei a versão mais recente para evitar sobrescrever as alterações. Confira os dados e refaça sua edição, se necessário.");if(currentId===p.id)renderProject();return false}projects=await allProjects();setSync("Sincronizado");return p}
function newId(){if(window.crypto&&crypto.randomUUID)return crypto.randomUUID();const b=new Uint8Array(16);(window.crypto||{getRandomValues:a=>a.map(()=>Math.random()*256)}).getRandomValues(b);b[6]=b[6]&15|64;b[8]=b[8]&63|128;const h=[...b].map(x=>x.toString(16).padStart(2,"0")).join("");return h.slice(0,8)+"-"+h.slice(8,12)+"-"+h.slice(12,16)+"-"+h.slice(16,20)+"-"+h.slice(20)}
function collectFilePaths(v,projectId,out=[]){if(Array.isArray(v)){v.forEach(x=>collectFilePaths(x,projectId,out))}else if(v&&typeof v==="object"){if(typeof v.path==="string"&&v.path.includes("/"+projectId+"/"))out.push(v.path);Object.values(v).forEach(x=>{if(x&&typeof x==="object")collectFilePaths(x,projectId,out)})}return out}
async function deleteProject(id){const p=projects.find(x=>x.id===id);if(!p)return;
if(!confirm(`Excluir o projeto "${p.name}" por completo?\n\nTodas as etapas, aprovações, histórico e anexos serão removidos para todos os usuários.\nEsta ação não pode ser desfeita.`))return;
setSync("Excluindo...");
try{const {data,error}=await supabaseClient.from("projects").delete().eq("id",id).select("id");
if(error)throw error;
if(!data||!data.length){setSync("Exclusão não permitida",true);alert("Não foi possível excluir: o banco de dados não autorizou a exclusão deste projeto (falta permissão de DELETE para o seu usuário). Nenhum dado foi apagado.");return}
const paths=[...new Set(collectFilePaths(p,id))];
if(paths.length){try{await supabaseClient.storage.from(STORAGE_BUCKET).remove(paths)}catch(e){console.warn("Anexos não removidos do armazenamento:",e)}}
projects=await allProjects();if(currentId===id)currentId=null;setSync("Sincronizado");
const page=document.querySelector(".nav button.active")?.dataset.page;
showPage(page==="dashboard"?"dashboard":"projects");
}catch(e){console.error("Erro ao excluir projeto:",e);setSync("Erro ao excluir",true);alert("Não foi possível excluir o projeto: "+(e.message||e))}}
function getP(){return projects.find(p=>p.id===currentId)}
function esc(s=""){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function dateNow(){let d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
const DEFAULT_DAYS=[5,10,5,5,15,20,10,5,3,3,5,15,20,3,3,15,3,10,7,3,2,2,30];
const DELAY_CAUSES=["Aguardando fornecedor ou amostra","Aguardando terceiro (gráfica, laboratório, certificadora)","Aguardando aprovação interna","Retrabalho ou reprovação técnica","Mudança de escopo ou requisito","Prioridade ou falta de recurso","Outro"];
function dayDiff(a,b){return Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/864e5)}
function addWork(d,n){let x=new Date(d+"T12:00:00");while(n>0){x.setDate(x.getDate()+1);if(x.getDay()%6)n--}return x.toISOString().slice(0,10)}
function stageDelay(s){if(!s.plannedEnd||s.status==="Suspensa")return null;if(s.status==="Concluída"){let d=s.end?dayDiff(s.plannedEnd,s.end):0;return d>0?{kind:"done",days:d}:null}let d=dayDiff(s.plannedEnd,dateNow());return d>0?{kind:"open",days:d}:null}
function stageSoon(s){if(!s.plannedEnd||s.status==="Concluída"||s.status==="Suspensa")return false;let d=dayDiff(dateNow(),s.plannedEnd);return d>=0&&d<=3}
function delayBadge(s){let d=stageDelay(s);if(d)return `<span class="badge red">${d.kind==="open"?"Atrasada "+d.days+"d":"Concluída com "+d.days+"d de atraso"}</span>`;if(stageSoon(s)){let n=dayDiff(dateNow(),s.plannedEnd);return `<span class="badge orange">${n?"Vence em "+n+"d":"Vence hoje"}</span>`}return ""}
function health(p){if(["Concluído","Reprovado","Suspenso"].includes(p.status))return{k:"none"};let n=(p.stages||[]).filter(s=>stageDelay(s)?.kind==="open").length,t=dateNow();if(p.due&&p.due<t)return{k:"late",n,days:dayDiff(p.due,t)};if(n)return{k:"risk",n};if(p.due&&dayDiff(t,p.due)<=7)return{k:"soon",days:dayDiff(t,p.due)};return{k:"ok"}}
function healthBadge(p){let h=health(p);return h.k==="late"?`<span class="badge red">Atrasado ${h.days}d</span>`:h.k==="risk"?`<span class="badge orange">${h.n} etapa(s) atrasada(s)</span>`:h.k==="soon"?`<span class="badge orange">Vence em ${h.days}d</span>`:""}
function deadlineSummary(p){let st=p.stages||[],l=st.filter(s=>stageDelay(s)?.kind==="open").length,d=st.filter(s=>stageDelay(s)?.kind==="done").length,w=st.filter(stageSoon).length,n=st.filter(s=>s.plannedEnd).length;return n?`<div class="notice ${l?"":"blue"}"><b>Prazos:</b> ${n}/23 etapas com prazo definido · ${l} atrasada(s) · ${w} vencendo em até 3 dias · ${d} concluída(s) com atraso</div>`:`<div class="notice">Nenhum prazo definido por etapa ainda. Na aba <b>Cronograma</b>, use <b>Planejar prazos</b> para gerar um cronograma sugerido e ajustar depois.</div>`}
function attentionHTML(){let rows=[];projects.forEach(p=>{if(["Concluído","Reprovado","Suspenso"].includes(p.status))return;(p.stages||[]).forEach(s=>{let d=stageDelay(s);if(d&&d.kind==="open")rows.push({p,s,days:d.days,late:1});else if(stageSoon(s))rows.push({p,s,days:dayDiff(dateNow(),s.plannedEnd),late:0})})});rows.sort((a,b)=>b.late-a.late||(a.late?b.days-a.days:a.days-b.days));
return `<div class="panel"><div class="panelhead"><h2>Atenção aos prazos</h2><span class="badge ${rows.some(r=>r.late)?"red":""}">${rows.length} etapa(s)</span></div>${rows.length?`<div class="tablewrap"><table><thead><tr><th>Projeto</th><th>Etapa</th><th>Responsável</th><th>Prazo da etapa</th><th>Situação</th><th>Motivo</th><th></th></tr></thead><tbody>${rows.slice(0,10).map(r=>`<tr><td><strong>${esc(r.p.code||r.p.name)}</strong></td><td>${r.s.number}. ${esc(r.s.name)}</td><td>${esc(r.s.responsible||r.p.owner||"—")}</td><td>${fmt(r.s.plannedEnd)}</td><td>${delayBadge(r.s)}</td><td>${esc(r.s.delayCause||"—")}</td><td><button class="btn small" onclick="openProject('${r.p.id}');setTab('stages')">Abrir →</button></td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">Nenhuma etapa atrasada ou vencendo nos próximos 3 dias.</div>`}</div>`}
function fmt(d){if(!d)return "—";let x=new Date(d+"T12:00:00");return x.toLocaleDateString("pt-BR")}
function statusBadge(s){let c=s==="Concluída"||s==="Aprovado"?"green":s==="Em andamento"?"blue":s==="Atrasada"||s==="Reprovado"?"red":s==="Aguardando aprovação"?"orange":"";return `<span class="badge ${c}">${esc(s||"Não iniciada")}</span>`}
function doneCount(p){return (p.stages||[]).filter(s=>s.status==="Concluída").length}
function progress(p){return Math.round(doneCount(p)/STAGES.length*100)}
function renderDashboard(){document.getElementById("crumb").textContent="Visão geral";let total=projects.length, active=projects.filter(p=>!["Concluído","Reprovado"].includes(p.status)).length, waiting=projects.filter(p=>p.status==="Aguardando aprovação").length, finished=projects.filter(p=>p.status==="Concluído").length, late=projects.filter(p=>["late","risk"].includes(health(p).k)).length;
document.getElementById("view").innerHTML=`
<div class="pagehead"><div><div class="eyebrow">Workspace de desenvolvimento</div><h1>Visão geral</h1><p class="sub">Acompanhamento dos projetos conforme o PG-8.03 · Revisão 08.</p></div><button class="btn primary" onclick="newProject()">＋ Novo projeto</button></div>
<div class="stats">
<div class="stat"><div class="label">Projetos cadastrados</div><div class="num">${total}</div><div class="hint">Total no ambiente</div></div>
<div class="stat"><div class="label">Em andamento</div><div class="num">${active}</div><div class="hint">Projetos não encerrados</div></div>
<div class="stat"><div class="label">Aguardando aprovação</div><div class="num">${waiting}</div><div class="hint">Dependem de decisão</div></div>
<div class="stat"><div class="label">Concluídos</div><div class="num">${finished}</div><div class="hint">Projetos encerrados</div></div>

function autoGrow(el){if(!el||el.offsetParent===null)return;el.style.height="auto";el.style.height=(el.scrollHeight+2)+"px"}
(function(){let t=null;const sweep=()=>{t=null;document.querySelectorAll(".field textarea").forEach(el=>{if(el.offsetParent!==null&&!el.style.height)autoGrow(el)})};
const run=()=>{document.addEventListener("input",e=>{if(e.target&&e.target.tagName==="TEXTAREA")autoGrow(e.target)});
new MutationObserver(()=>{if(!t)t=requestAnimationFrame(sweep)}).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:["class"]});sweep()};
document.body?run():document.addEventListener("DOMContentLoaded",run)})();
const pendingFiles=new WeakMap();
function renderPending(input){let box=input.nextElementSibling&&input.nextElementSibling.classList.contains("pendinglist")?input.nextElementSibling:null;if(!box){box=document.createElement("div");box.className="pendinglist";input.insertAdjacentElement("afterend",box)}
const list=pendingFiles.get(input)||[];box.innerHTML=list.length?list.map((f,i)=>`<div class="fileitem"><span>🕓 ${esc(f.name)} <small class="muted">· será anexado ao salvar</small></span><button type="button" class="btn small danger" data-rm="${i}" title="Remover da lista">✕</button></div>`).join(""):"";
box.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{list.splice(+b.dataset.rm,1);renderPending(input)})}
document.addEventListener("change",e=>{const el=e.target;if(!el||el.type!=="file")return;const list=pendingFiles.get(el)||[];for(const f of el.files){if(!list.some(x=>x.name===f.name&&x.size===f.size&&x.lastModified===f.lastModified))list.push(f)}pendingFiles.set(el,list);el.value="";renderPending(el)});
async function filesFrom(input,stageTitle,projectId=currentId){let files=[...(pendingFiles.get(input)||[])];if(!files.length)files=[...(input?.files||[])];let out=[];for(const f of files){if(!projectId)throw new Error("Não foi possível identificar o projeto para anexar o arquivo.");const safeName=f.name.replace(/[^a-zA-Z0-9._-]/g,"_");const path=`${currentUser.id}/${projectId}/${Date.now()}_${Math.random().toString(36).slice(2)}_${safeName}`;const {error}=await supabaseClient.storage.from(STORAGE_BUCKET).upload(path,f,{contentType:f.type||"application/octet-stream",upsert:false});if(error)throw error;out.push({name:f.name,type:f.type,size:f.size,path,uploadedAt:new Date().toISOString(),stage:stageTitle})}if(input){pendingFiles.delete(input);if(input.isConnected)renderPending(input)}return out}
async function downloadEvidence(path){const {data,error}=await supabaseClient.storage.from(STORAGE_BUCKET).createSignedUrl(path,60);if(error){alert("Não foi possível abrir o anexo: "+error.message);return}window.open(data.signedUrl,"_blank","noopener")}
async function migrateLegacyFiles(value,projectId){if(Array.isArray(value)){for(let i=0;i<value.length;i++)value[i]=await migrateLegacyFiles(value[i],projectId);return value}if(value&&typeof value==="object"){if(value.data&&typeof value.data==="string"&&value.data.startsWith("data:")&&!value.path){const res=await fetch(value.data),blob=await res.blob(),safeName=(value.name||"anexo").replace(/[^a-zA-Z0-9._-]/g,"_");const path=`${currentUser.id}/${projectId}/${Date.now()}_${Math.random().toString(36).slice(2)}_${safeName}`;const {error}=await supabaseClient.storage.from(STORAGE_BUCKET).upload(path,blob,{contentType:value.type||blob.type||"application/octet-stream"});if(error)throw error;delete value.data;value.path=path}for(const k of Object.keys(value)){if(k!=="data")value[k]=await migrateLegacyFiles(value[k],projectId)}return value}return value}
function readBlobAsDataURL(blob){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.readAsDataURL(blob)})}
async function expandFilesForBackup(value){if(Array.isArray(value)){const out=[];for(const v of value)out.push(await expandFilesForBackup(v));return out}if(value&&typeof value==="object"){const out={...value};if(value.path){const {data,error}=await supabaseClient.storage.from(STORAGE_BUCKET).download(value.path);if(error)throw error;out.data=await readBlobAsDataURL(data)}for(const k of Object.keys(out)){if(k!=="data")out[k]=await expandFilesForBackup(out[k])}return out}return value}

async function savePlanning(key){
const btn=document.activeElement&&document.activeElement.tagName==="BUTTON"?document.activeElement:null,label=btn?btn.textContent:"";
const mainEl=document.querySelector(".main"),y=mainEl?mainEl.scrollTop:0;
try{
if(btn){btn.disabled=true;btn.textContent="Salvando..."}
const g=id=>document.getElementById(id),title=planningFields.find(f=>f[0]===key)[1];
const textv=g("plan_"+key).value,owner=g("planowner_"+key).value,date=g("plandate_"+key).value;
const files=await filesFrom(g("planfiles_"+key),title);
let p=getP();if(!p)throw new Error("Projeto não encontrado. Recarregue a página.");
p.planning=p.planning||{};const old=p.planning[key]||{};
p.planning[key]={text:textv,owner,date,updated:new Date().toISOString(),files:[...(old.files||[]),...files]};
addEvent(p,"Planejamento atualizado",title);
const r=await save(p);

async function sendDelayAlert(projectId,only,origin){
 try{
  let p=projects.find(x=>x.id===projectId);if(!p)return;

   await save(fresh)}
  setSync("Alerta de atraso enviado");
  alert("⚠ "+late.length+" etapa(s) em atraso.\nE-mail de alerta enviado para gabriel@hitech.ind.br.");
 }catch(e){
  console.error("Falha ao enviar alerta de atraso:",e);setSync("Falha no e-mail de atraso",true);
  alert("O prazo foi salvo, mas NÃO foi possível enviar o e-mail de atraso para gabriel@hitech.ind.br.\n\nMotivo: "+((e&&e.message)||e));
 }
}

async function deleteEvidence(key){const p=getP();if(!p)return;let found=null;

const f=found.arr[found.i];

renderProjectTab()}catch(e){console.error(e);alert("Não foi possível excluir o anexo: "+(e.message||e));projects=await allProjects();renderProjectTab()}}
function fileList(files,download=false){if(!files||!files.length)return `<p class="muted" style="font-size:11px">Nenhuma evidência anexada.</p>`;return `<div class="filelist">${files.map((f,i)=>`<div class="fileitem"><span>📎 ${esc(f.name)} <small class="muted">· ${esc(f.stage||"")}</small></span><span style="display:flex;gap:6px;flex-shrink:0">${f.data?`<a class="btn small" href="${f.data}" download="${esc(f.name)}">Abrir / baixar</a>`:f.path?`<button class="btn small" onclick="downloadEvidence('${esc(f.path)}')">Abrir / baixar</button>`:""}<button type="button" class="btn small danger" data-k="${esc(f.path||("legacy|"+f.name+"|"+(f.uploadedAt||"")))}" onclick="deleteEvidence(this.dataset.k)" title="Excluir anexo">🗑</button></span></div>`).join("")}</div>`}
function historyHTML(p){return `<div class="panel"><div class="panelhead"><h2>Histórico cronológico do projeto</h2><span class="badge">${(p.events||[]).length} movimentações</span></div><div class="panelbody">${timelineHTML((p.events||[]).slice().reverse())}</div></div>`}
function timelineHTML(events){if(!events.length)return `<div class="empty">Ainda não há movimentações registradas.</div>`;return `<div class="timeline">${events.map(e=>`<div class="event"><strong>${esc(e.title)}</strong><p>${new Date(e.date).toLocaleString("pt-BR")} · ${esc(e.detail||"")}</p></div>`).join("")}</div>`}
function renderGlobalTimeline(){document.getElementById("crumb").textContent="Histórico geral";let ev=projects.flatMap(p=>(p.events||[]).map(e=>({...e,project:p.name,code:p.code}))).sort((a,b)=>b.date.localeCompare(a.date));document.getElementById("view").innerHTML=`<div class="pagehead"><div><div class="eyebrow">Rastreabilidade</div><h1>Histórico geral</h1><p class="sub">Movimentações registradas nos projetos cadastrados.</p></div></div><div class="panel"><div class="panelbody">${ev.length?`<div class="timeline">${ev.map(e=>`<div class="event"><strong>${esc(e.title)} · ${esc(e.project)}</strong><p>${new Date(e.date).toLocaleString("pt-BR")} · ${esc(e.detail||"")}</p></div>`).join("")}</div>`:`<div class="empty">Nenhuma movimentação registrada.</div>`}</div></div>`}
function addEvent(p,title,detail){p.events=p.events||[];p.events.push({date:new Date().toISOString(),title,detail});p.updated=new Date().toISOString()}
function editProject(){let p=getP();document.getElementById("modalTitle").textContent="Editar dados básicos";document.getElementById("modalBody").innerHTML=`<div class="grid"><div class="field"><label>Nome do projeto</label><input id="e_name" value="${esc(p.name)}"></div><div class="field"><label>Código</label><input id="e_code" value="${esc(p.code)}"></div><div class="field"><label>Responsável</label><input id="e_owner" value="${esc(p.owner)}"></div><div class="field"><label>Prazo</label><input id="e_due" type="date" value="${esc(p.due)}"></div><div class="field full"><label>Motivo da alteração do prazo</label><input id="e_dueReason" placeholder="Obrigatório se o prazo for alterado"></div><div class="field"><label>Status geral</label><select id="e_status">${["Em andamento","Aguardando aprovação","Concluído","Reprovado","Suspenso"].map(x=>`<option ${p.status===x?"selected":""}>${x}</option>`).join("")}</select></div></div>`;document.getElementById("modalSave").onclick=async()=>{p.name=document.getElementById("e_name").value;p.code=document.getElementById("e_code").value;p.owner=document.getElementById("e_owner").value;let nd=document.getElementById("e_due").value,rs=document.getElementById("e_dueReason").value.trim();if(p.due&&nd!==p.due){if(!rs){alert("Informe o motivo da alteração do prazo.");return}(p.dueHistory=p.dueHistory||[]).push({date:new Date().toISOString(),from:p.due,to:nd,reason:rs});addEvent(p,"Prazo do projeto alterado",`${fmt(p.due)} → ${fmt(nd)}. Motivo: ${rs}`)}if(!p.dueOriginal&&(p.due||nd))p.dueOriginal=p.due||nd;p.due=nd;p.status=document.getElementById("e_status").value;addEvent(p,"Dados básicos atualizados","Nome, código, responsável, prazo ou status alterado.");await save(p);closeModal();renderProject()};document.getElementById("modal").classList.add("show")}
document.querySelectorAll(".nav button").forEach(b=>b.addEventListener("click",()=>showPage(b.dataset.page)));
load().catch(e=>{setSync("Erro de conexão",true);showAuth("Falha ao iniciar o sistema: "+e.message)});
</script>

<script>
/* Barra lateral: botão para expandir/recolher (estado lembrado no navegador) */
(function(){
 const KEY="hitech_sidebar_collapsed";
 const app=document.querySelector(".app"),btn=document.getElementById("sbToggle");
 if(!app||!btn)return;
 const label=btn.querySelector(".sbtoggle-txt");
 const items=[...document.querySelectorAll(".nav button")];
 function apply(c){
  app.classList.toggle("sbcompact",c);
  btn.setAttribute("aria-expanded",String(!c));
  const t=c?"Expandir barra lateral":"Recolher barra lateral";
  btn.setAttribute("aria-label",t);btn.title=t;
  if(label)label.textContent=c?"Expandir menu":"Recolher menu";
  items.forEach(b=>{const n=b.querySelector(".navtext");if(c&&n)b.title=n.textContent;else b.removeAttribute("title")});
 }
 let c=false;
 try{c=localStorage.getItem(KEY)==="1"}catch(e){}
 apply(c);
 btn.addEventListener("click",()=>{
  app.classList.add("sbanim");
  c=!app.classList.contains("sbcompact");
  apply(c);
  try{localStorage.setItem(KEY,c?"1":"0")}catch(e){}
 });
})();
</script>
